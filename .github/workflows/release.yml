name: release
run-name: Release "${{ github.ref_name }}"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      prerelease: ${{ steps.set_tag.outputs.prerelease }}
    steps:
      - name: Set Tag
        id: set_tag
        run: |
          TAG="$(echo $GITHUB_REF | sed -n 's/refs\/tags\/v//p')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Mark SemVer pre-releases (e.g. 1.2.0-rc1) as GitHub pre-releases.
          if printf '%s' "$TAG" | grep -q -- '-'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Format
        uses: ./.github/actions/format

  unit-tests:
    needs:
      - prepare
      - format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21", "25"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Unit Tests
        uses: ./.github/actions/unit-tests
        with:
          java-version: ${{ matrix.java-version }}
          version: ${{ needs.prepare.outputs.tag }}

  integration-tests:
    needs:
      - prepare
      - unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - littlehorse-quarkus
          - littlehorse-restful-gateway
          - littlehorse-saddle-bag
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Integration Tests
        uses: ./.github/actions/integration-tests
        with:
          project: ${{ matrix.project }}
          version: ${{ needs.prepare.outputs.tag }}

  publish:
    runs-on: ubuntu-latest
    needs:
      - prepare
      - integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Publish
        uses: ./.github/actions/publish
        with:
          version: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          signing-key: ${{ secrets.GPG_PRIVATE_KEY }}
          signing-password: ${{ secrets.GPG_PASSPHRASE }}
          sonatype-username: ${{ secrets.OSSRH_USERNAME }}
          sonatype-password: ${{ secrets.OSSRH_PASSWORD }}

  create-release:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Generate a Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --current
        env:
          OUTPUT: CHANGELOG.md
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: gh release create ${{ github.ref_name }} -t ${{ github.ref_name }} -F CHANGELOG.md --prerelease="$PRERELEASE"

  docker-build-restful-gateway:
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker Build RESTful Gateway
        uses: ./.github/actions/docker-build
        with:
          gradle-project: restful-gateway
          image-name: lh-restful-gateway
          dockerfile: ./extras/restful-gateway/Dockerfile
          context: ./extras/restful-gateway
          version: ${{ needs.prepare.outputs.tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}

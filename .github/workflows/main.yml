name: main
run-name: Publish Snapshot on main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties)" >> $GITHUB_OUTPUT

      - name: Validate snapshot format
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -i -- '-SNAPSHOT$' >/dev/null; then
              echo "ERROR: version does not end with -SNAPSHOT" >&2
              exit 1
          fi

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Format
        uses: ./.github/actions/format

  unit-tests:
    needs:
      - prepare
      - format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ["17", "21", "25"]
        project:
          - littlehorse-quarkus
          - littlehorse-restful-gateway
          - littlehorse-saddle-bag
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Unit Tests
        uses: ./.github/actions/unit-tests
        with:
          java-version: ${{ matrix.java-version }}
          project: ${{ matrix.project }}
          version: ${{ needs.prepare.outputs.version }}

  integration-tests:
    needs:
      - prepare
      - unit-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - littlehorse-quarkus
          - littlehorse-restful-gateway
          - littlehorse-saddle-bag
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Integration Tests
        uses: ./.github/actions/integration-tests
        with:
          project: ${{ matrix.project }}
          version: ${{ needs.prepare.outputs.version }}

  publish:
    needs:
      - prepare
      - integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"

      - name: Publish Snapshot
        env:
          ORG_GRADLE_PROJECT_version: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publishToSonatype

  docker-build-restful-gateway:
    needs:
      - prepare
      - integration-tests
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Docker Build RESTful Gateway
        uses: ./.github/actions/docker-build
        with:
          gradle-project: restful-gateway
          image-name: lh-restful-gateway
          dockerfile: ./extras/restful-gateway/Dockerfile
          context: ./extras/restful-gateway
          version: ${{ needs.prepare.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

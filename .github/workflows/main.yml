name: main
run-name: Publish Snapshot on main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+"

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Get version
        id: get_version
        run: echo "version=$(sed -n 's/^version=//p' gradle.properties)" >> $GITHUB_OUTPUT

      - name: Validate snapshot format
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -i -- '-SNAPSHOT$' >/dev/null; then
              echo "ERROR: version does not end with -SNAPSHOT" >&2
              exit 1
          fi

  tests:
    needs:
      - prepare
    strategy:
      matrix:
        project:
          - littlehorse-quarkus
          - littlehorse-quarkus-restful-gateway
          - littlehorse-saddle-bag
    uses: ./.github/workflows/tests.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      project: ${{ matrix.project }}

  publish:
    needs:
      - prepare
      - tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "corretto"
          java-version: "25"

      - name: Publish Snapshot
        env:
          ORG_GRADLE_PROJECT_version: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.OSSRH_PASSWORD }}
        run: ./gradlew publishToSonatype

  docker-build-restful-gateway:
    needs:
      - prepare
      - tests
      - publish
    uses: ./.github/workflows/restful-gateway.yml
    with:
      version: ${{ needs.prepare.outputs.version }}

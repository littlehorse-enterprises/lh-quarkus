# Disable build-time generated (reflection-free) Jackson serializers so the custom
# ProtobufMessageSerializer (registered on com.google.protobuf.Message via
# ProtobufObjectMapperCustomizer) is used to serialize proto responses.
#
# Without this, Quarkus generates reflection-free serializers for the concrete proto
# response types (e.g. TaskDef). Those serializers walk proto internals such as
# UnknownFieldSet and fail with "Direct self-reference leading to cycle" in packaged/prod
# builds (dev mode does not generate them, which is why it only surfaces at runtime/IT).
#
# This is a build-time (fixed) config property, so it is resolved when the application is built
# and cannot be changed at runtime. Applications may override it by setting the property in their
# own application.properties (or another build-time config source) before building.
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
